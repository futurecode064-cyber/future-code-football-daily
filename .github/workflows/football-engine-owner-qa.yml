name: Football Hosted Owner Service and Real Snapshot QA
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  owner-preview:
    if: >-
      github.repository == 'futurecode064-cyber/future-code-football-daily' &&
      github.event.pull_request.number == 36 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'football-engine/workers-d1-migration' &&
      github.event.label.name == 'football-engine-owner-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: services/football-engine
      - run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - run: node --test services/football-engine/tests/*.test.mjs
      - name: Hosted isolated owner session, real unchanged private draft, five brands and downloads
        env:
          FOOTBALL_STAGING_CF_API_TOKEN: ${{ secrets.FOOTBALL_STAGING_CF_API_TOKEN }}
        run: node scripts/football/qa-owner-hosted.mjs football-owner-hosted-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-owner-hosted-evidence
          path: football-owner-hosted-evidence/
          retention-days: 14
# No production Pages/Worker/D1 writes. Original staging unchanged. Real JSON stays unpublished.
