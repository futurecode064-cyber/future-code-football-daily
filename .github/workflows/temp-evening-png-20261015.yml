name: One-time 15 October evening odds static PNG generation and validation
on:
  push:
    branches: [publish/evening-odds-20261015-36-pngs]
    paths: [.github/workflows/temp-evening-png-20261015.yml]
permissions:
  contents: write
jobs:
  make-png:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Myanmar Noto Unicode font and PNG support
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          test -f /usr/share/fonts/truetype/noto/NotoSansMyanmar-Regular.ttf
          test -f /usr/share/fonts/truetype/noto/NotoSansMyanmar-Bold.ttf
      - name: Produce real directly downloadable 12 PNGs for four sites
        run: python football-daily/scripts/generate_evening_png.py 2026-10-15
      - name: Check file signatures and every league/brand combination
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('football-daily/data/odds')
          new=json.loads((root/'evening/2026-10-15.json').read_text())
          old=json.loads((root/'2026-10-15.json').read_text())
          assert len(new['matches'])==len(old['matches'])==36
          assert all(a['row']==i+1 and a['home']==b['home'] and a['away']==b['away'] and a['upperTeam']==b['upperTeam'] and a['morningBodyOdds']==b['bodyOdds'] and a['morningGoalTotalOdds']==b['goalTotalOdds'] for i,(a,b) in enumerate(zip(new['matches'],old['matches'])))
          assert [sum(m['league']==league for m in new['matches']) for league in ['UEFA Europa League','UEFA Conference League']]==[18,18]
          out=root/'evening/png/2026-10-15'
          brands=['future-code','ykz-family','bw-sport','ko-thet-family']
          slugs=['all','uefa-europa-league','uefa-conference-league']
          for b in brands:
            for s in slugs:
              p=out/(b+'-'+s+'.png')
              assert p.exists() and p.stat().st_size>10000,str(p)
              with Image.open(p) as img:img.verify()
          assert len(list(out.glob('*.png')))==12
          print('Validated 36 PDF-matched rows and 12 full-size branded downloadable PNGs')
          PY
      - name: Full football website tests
        run: node --test football-daily/tests/*.test.cjs
      - name: Daily audit
        run: python football-daily/scripts/daily_guard.py audit
      - name: Commit 12 verified binary PNGs on the same feature branch
        run: |
          set -euo pipefail
          git config user.name "future-code-evening-png[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- football-daily/data/odds/evening/png/2026-10-15/
          git diff --cached --quiet && exit 0
          git commit -m "Add 12 downloadable PNG files for 15 October evening odds across four brands"
          git push origin HEAD:publish/evening-odds-20261015-36-pngs
