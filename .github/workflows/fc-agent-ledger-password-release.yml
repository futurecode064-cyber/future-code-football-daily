name: FC Agent Ledger - Password Length Update
on:
  push:
    branches: [fc-agent-ledger-free-deploy]
    paths:
      - '.github/workflows/fc-agent-ledger-password-release.yml'
permissions:
  contents: read
concurrency:
  group: fc-agent-ledger-free-deployment
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'futurecode064-cyber/future-code-football-daily'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.FOOTBALL_STAGING_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '86851bf21d81d8f0972052aff8162149'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply password UX patch and run regression tests
        run: |
          unzip -q fc-agent-ledger/source.zip -d fc-agent-ledger/staging
          node fc-agent-ledger/password-policy-overlay.mjs
          cat fc-agent-ledger/password-policy-regression.mjs >> fc-agent-ledger/staging/FC-Agent-Ledger-Cloudflare-Free/tests/integration.test.mjs
          cd fc-agent-ledger/staging/FC-Agent-Ledger-Cloudflare-Free
          node --check src/worker.mjs
          node --check public/app.js
          node --test tests/*.test.mjs
          npm install --no-audit --no-fund
      - name: Preserve existing D1 and secure setup configuration
        working-directory: fc-agent-ledger/staging/FC-Agent-Ledger-Cloudflare-Free
        run: node ../../password-policy-deploy-config.cjs
      - name: Update only existing FC Agent Ledger Worker
        working-directory: fc-agent-ledger/staging/FC-Agent-Ledger-Cloudflare-Free
        run: npx wrangler deploy
      - name: Verify live health, password UX, and unauthenticated access restrictions
        run: |
          node <<'NODE'
          const base='https://fc-agent-ledger-private-v1.futurecode-dubai-86851bf2.workers.dev';
          const h=await fetch(base+'/health');
          if(!h.ok || !(await h.json()).ok)throw Error('Health check failed');
          const r=await fetch(base+'/app.js');
          if(!r.ok)throw Error('App frontend unavailable');
          const a=await r.text();
          if(a.includes('minlength="12"') || a.includes('12+ characters') || !a.includes('Password ကို လိုသလိုသတ်မှတ်နိုင်ပါတယ်'))throw Error('New password policy UI not published');
          const boot=await fetch(base+'/api/bootstrap/status');if(!boot.ok)throw Error('Bootstrap status missing');
          const anonymous=await fetch(base+'/api/tenants');if(anonymous.status!==401)throw Error('Tenant access control failed');
          console.log('FC_AGENT_LEDGER_PASSWORD_RELEASE_LIVE_OK');
          NODE
