name: BCF Android Journal - isolated build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bcf-journal-build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare isolated BCF application
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src=Path("android-journal")
          dst=Path("/tmp/bcf-native")
          shutil.copytree(src,dst,ignore=shutil.ignore_patterns("build"))
          replacements=[
            ("mm.futurecode.sportsjournal","mm.futurecode.betcityfamily"),
            ("future-code-journal","bet-city-family"),
            ("ဂိုးဇုံ အားကစား ဂျာနယ်","BCF ဘောလုံးဂျာနယ်"),
            ("Goal Zone Sports Journal","BCF Journal"),
            ("Goal-Zone-Journal-","BCF-Journal-"),
            ("Goal-Zone-Sports-Journal","BCF-Journal"),
            ("Policy.HOME+\"odds\"","Policy.HOME+\"odds.html\""),
            ("0xff111111","0xff020a2d"),
            ("0xff171717","0xff09164c"),
            ("0xffedc66b","0xffffd77d"),
            ("0xffd4ae57","0xff1053c8"),
            ("#111111","#020A2D"),
          ]
          for path in [*dst.rglob("*.java"),*dst.rglob("*.xml"),*dst.rglob("*.js"),dst/"README.md"]:
            value=path.read_text(encoding="utf8")
            for old,new in replacements:
              value=value.replace(old,new)
            if path.name=="AndroidManifest.xml" and path.parent==dst:
              value=value.replace('android:versionCode="2" android:versionName="1.0.1"','android:versionCode="1" android:versionName="1.0.0"')
            if path.name=="Policy.java":
              value=value.replace('public static final String MANIFEST=HOME+"android/latest.json";','public static final String MANIFEST=HOME+"android/latest.json";')
              start=value.index("public static boolean trustedApk(")
              value=value[:start]+'''public static boolean trustedApk(String value){try{java.net.URI u=new java.net.URI(value);return "https".equals(u.getScheme())&&"github.com".equals(u.getHost())&&u.getPath().startsWith("/futurecode064-cyber/future-code-football-daily/releases/download/bcf-journal-v")&&u.getPath().endsWith(".apk");}catch(Exception e){return false;}}
          }
          '''
            if path.name=="ContentNotifier.java":
              point=" public static synchronized void check(Context c)throws Exception{"
              assert point in value
              value=value.replace(point,''' public static void ownerBroadcast(Context c){
            try{
              org.json.JSONObject j=Net.json(Policy.HOME+"android/notifications.json");
              if(!j.optBoolean("active",false))return;
              String id=j.optString("id","").trim(),title=j.optString("title","").trim(),body=j.optString("body","").trim();
              if(id.isEmpty()||id.length()>100||title.isEmpty()||body.isEmpty()||title.length()>120||body.length()>500)return;
              String route=j.optString("route",Policy.HOME);
              if(!Policy.trustedPage(route))route=Policy.HOME;
              android.content.SharedPreferences prefs=c.getSharedPreferences("bcf_owner_notice",0);
              if(id.equals(prefs.getString("last_id","")))return;
              if(post(c,105,title,body,route,false))prefs.edit().putString("last_id",id).apply();
            }catch(Exception ignored){}
           }
          '''+point)
              value=value.replace('  channels(c);if(!enabled(c))return;','  channels(c);if(!enabled(c))return;ownerBroadcast(c);')
            if path.name=="Net.java":
              value=value.replace('!"future-code-football-daily.pages.dev".equals(url.getHost())','!("future-code-football-daily.pages.dev".equals(url.getHost())||("raw.githubusercontent.com".equals(url.getHost())&&address.equals(Policy.MANIFEST))||("github.com".equals(url.getHost())&&Policy.trustedApk(address)))')
              value=value.replace('c.setInstanceFollowRedirects(false);','c.setInstanceFollowRedirects(Policy.trustedApk(address));')
            path.write_text(value,encoding="utf8")
          for test in dst.glob("tests/src/**/*.java"):
            if "sportsjournal" in test.read_text():
              raise Exception("Original journal package not converted")
          assert (dst/"src/mm/futurecode/sportsjournal/MainActivity.java").exists()
          main=(dst/"src/mm/futurecode/sportsjournal/MainActivity.java").read_text()
          assert "mm.futurecode.betcityfamily" in main
          assert "BCF ဘောလုံးဂျာနယ်" in main
          assert "Policy.HOME+\"odds.html\"" in main
          print("BCF app identity, notification channels, image saving and update verification prepared")
          PY
          curl -fL --retry 3 "https://raw.githubusercontent.com/futurecode064-cyber/AI-Recap-GitHub/football-daily-render/football-daily/bet-city-family/assets/logo.png" -o /tmp/bcf-native/res/drawable-nodpi/logo.png
          file /tmp/bcf-native/res/drawable-nodpi/logo.png
          python3 /tmp/bcf-native/build.py
          cp /tmp/bcf-native/build/Future-Code-Sports-Journal-unsigned.apk BCF-Journal-v1.0.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" bcf-apksigner.jar
      - name: Verify unsigned APK package and dex
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging BCF-Journal-v1.0.0-unsigned.apk | grep "mm.futurecode.betcityfamily"
          unzip -l BCF-Journal-v1.0.0-unsigned.apk | grep classes.dex

      - name: Create installable Android APK release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_KEYSTORE_B64: ${{ secrets.BCF_RELEASE_KEYSTORE_B64 }}
          OWNER_STOREPASS: ${{ secrets.BCF_RELEASE_STOREPASS }}
          OWNER_ALIAS: ${{ secrets.BCF_RELEASE_ALIAS }}
          OWNER_KEYPASS: ${{ secrets.BCF_RELEASE_KEYPASS }}
        run: |
          set -euo pipefail
          # FAIL CLOSED: never generate a new signing key or overwrite an existing live APK.
          if [[ -z "$OWNER_KEYSTORE_B64" || -z "$OWNER_STOREPASS" ]]; then
            echo "::error::Stable BCF signing key missing; refusing an incompatible upgrade"
            exit 1
          fi
          printf '%s' "$OWNER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bcf-release.p12"
          chmod 600 "$RUNNER_TEMP/bcf-release.p12"
          export ALIAS="${OWNER_ALIAS:-bcf-release}"
          export KEY_PASS="${OWNER_KEYPASS:-$OWNER_STOREPASS}"
          ACTUAL_CERT="$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/bcf-release.p12" \
            -storepass:env OWNER_STOREPASS -alias "$ALIAS" 2>/dev/null \
            | sed -nE 's/.*SHA256: ([0-9A-Fa-f:]+).*/\1/p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="064c09d10cf21740754221680a85079acea50daa84c0ec9b16d8165c095904d7"
          if [[ -z "$ACTUAL_CERT" || "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::BCF signing key does not match the currently distributed v1.0.0 APK"
            exit 1
          fi
          if gh release view bcf-journal-v1.0.0 >/dev/null 2>&1; then
            echo "::error::Existing v1.0.0 release is immutable; increase versionCode and choose new release tag"
            exit 1
          fi
          APK=BCF-Bet-City-Family-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/bcf-release.p12" --ks-type PKCS12 \
            --ks-key-alias "$ALIAS" --ks-pass "env:OWNER_STOREPASS" \
            --key-pass "env:KEY_PASS" --out "$APK" BCF-Journal-v1.0.0-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='mm.futurecode.betcityfamily'"
          sha256sum "$APK" | tee BCF-v1.0.0-SHA256.txt
          gh release create bcf-journal-v1.0.0 \
            --title 'BCF ဘောလုံးဂျာနယ် Android v1.0.0' \
            --notes "Android 8+; BCF live site; gallery image save; periodic updates and notifications. Future same-app upgrades require the same signing certificate."
          gh release upload bcf-journal-v1.0.0 "$APK" BCF-v1.0.0-SHA256.txt
      - name: Upload owner-signing build
        uses: actions/upload-artifact@v4
        with:
          name: BCF-Journal-Unsigned-Build
          path: |
            BCF-Journal-v1.0.0-unsigned.apk
            bcf-apksigner.jar
          if-no-files-found: error
