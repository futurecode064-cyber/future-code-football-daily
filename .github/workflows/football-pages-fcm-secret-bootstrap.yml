name: Future Code Pages Secure FCM Service Account Setup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/football-pages-fcm-secret-bootstrap.yml']
permissions:
  contents: read
concurrency:
  group: fc-pages-fcm-credential-setup
  cancel-in-progress: false
jobs:
  install-secret:
    if: github.repository == 'futurecode064-cyber/future-code-football-daily'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Securely add existing Firebase credential to original production Cloudflare Pages
        env:
          PAGES_TOKEN: ${{ secrets.FOOTBALL_PAGES_CF_API_TOKEN }}
          FIREBASE_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          node <<'NODE'
          async function main(){
            const token=process.env.PAGES_TOKEN||'',secret=process.env.FIREBASE_JSON||'';
            if(token.length<20||!secret)throw Error('Required existing Cloudflare/Firebase GitHub secrets are missing');
            let firebase;try{firebase=JSON.parse(secret)}catch{throw Error('Firebase JSON is invalid')}
            if(firebase.project_id!=='future-code-football'||!firebase.private_key?.includes('BEGIN PRIVATE KEY'))
              throw Error('Firebase project identity or credential invalid');
            const api='https://api.cloudflare.com/client/v4/accounts/86851bf21d81d8f0972052aff8162149/pages/projects/future-code-football-daily';
            const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
            async function call(method,body){
              const res=await fetch(api,{method,headers,body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(20000)});
              if(!res.ok)throw Error('Cloudflare '+method+' HTTP '+res.status);
              const data=await res.json();
              if(data.success!==true)throw Error('Cloudflare '+method+' returned unsuccessful status');
              return data.result;
            }
            const before=await call('GET');
            if(before.name!=='future-code-football-daily'||before.production_branch!=='football-daily-render'||
               before.source?.config?.repo_name!=='AI-Recap-GitHub'||before.source?.config?.owner!=='futurecode064-cyber')
              throw Error('Cloudflare production project identity mismatch');
            const old=before.deployment_configs?.production?.env_vars||{};
            if(!old.FCD_MAIN_PASSWORD||!old.FCD_SESSION_SECRET)throw Error('Owner login secrets must be preserved');
            const name='FCD_FCM_SERVICE_ACCOUNT_JSON';
            if(old[name]){console.log('FCM secret already configured in verified Pages project');return}
            await call('PATCH',{deployment_configs:{production:{env_vars:{[name]:{type:'secret_text',value:secret}}}}});
            const after=await call('GET');
            const keys=after.deployment_configs?.production?.env_vars||{};
            if(!keys[name]||keys[name].type!=='secret_text')throw Error('FCM secret did not persist as encrypted secret_text');
            if(Object.keys(old).some(k=>!keys[k]))throw Error('Existing production bindings missing after patch');
            if(!keys.FCD_MAIN_PASSWORD||!keys.FCD_SESSION_SECRET)throw Error('Owner credentials were not preserved');
            console.log('FCM encrypted Pages secret configured successfully; existing owner credentials preserved; no messages sent');
          }
          main().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
