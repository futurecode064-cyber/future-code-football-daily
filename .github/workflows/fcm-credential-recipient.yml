name: Football FCM Secure One-Way Credential Recipient
on:
  push:
    branches: ['feature/football-bundled-fcm-20261029']
    paths: ['.github/workflows/fcm-credential-recipient.yml']
permissions:
  contents: write
jobs:
  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RECOVERY: ${{ secrets.FOOTBALL_BACKUP_RECOVERY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Publish only X25519 public key from protected owner recovery secret
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import{hkdfSync,createPrivateKey,createPublicKey}from'node:crypto';
          import{mkdirSync,writeFileSync}from'node:fs';
          const m=process.env.RECOVERY||'';
          if(m.length<32)throw Error('Signing owner recovery secret unavailable');
          const seed=Buffer.from(hkdfSync('sha256',Buffer.from(m),Buffer.from('FutureCodeFootball/FcmTransport/2026'),Buffer.from('x25519-recipient-private'),32));
          const privateKey=createPrivateKey({key:Buffer.concat([Buffer.from('302e020100300506032b656e04220420','hex'),seed]),format:'der',type:'pkcs8'});
          const pub=createPublicKey(privateKey).export({type:'spki',format:'der'});
          mkdirSync('config/football',{recursive:true});
          writeFileSync('config/football/fcm-credential-recipient.spki.b64',pub.toString('base64')+'\n',{mode:0o644});
          console.log('Generated domain-separated public recipient key, no secret displayed.');
          JS
          if [[ -z "$(git status --porcelain -- config/football/fcm-credential-recipient.spki.b64)" ]]; then
            echo "Owner recovery recipient already committed"
            exit 0
          fi
          git config user.name "Future Code FCM CI"
          git config user.email "future-code-fcm-bot@users.noreply.github.com"
          git add config/football/fcm-credential-recipient.spki.b64
          git commit -m "security(fcm): publish recipient public key for encrypted private credential transfer"
          git push origin HEAD:feature/football-bundled-fcm-20261029
