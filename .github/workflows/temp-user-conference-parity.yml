name: Validate original uploaded Conference League texts
# Rerun with exact user-written draw verdicts accepted in editorial assertions.
on:
  push:
    branches: [editorial/user-verbatim-conference-20261015]
    paths: [.github/workflows/temp-user-conference-parity.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact original 18 Conference paragraphs and unchanged Europa
        run: node --test football-daily/tests/editorial-quality-20261015.test.cjs
      - name: All website, team, market and PNG regressions
        run: node --test football-daily/tests/*.test.cjs
      - name: Daily publication guard
        run: python football-daily/scripts/daily_guard.py audit
