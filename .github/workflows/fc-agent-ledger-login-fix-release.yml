name: FC Agent Ledger - Setup Error and Device Password UX Fix
on:
  push:
    branches: [fc-agent-ledger-free-deploy]
    paths:
      - '.github/workflows/fc-agent-ledger-login-fix-release.yml'
permissions:
  contents: read
concurrency:
  group: fc-agent-ledger-free-deployment
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'futurecode064-cyber/future-code-football-daily'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.FOOTBALL_STAGING_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '86851bf21d81d8f0972052aff8162149'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply targeted source patches and run all local regression tests
        run: |
          unzip -q fc-agent-ledger/source.zip -d fc-agent-ledger/staging
          node fc-agent-ledger/password-policy-overlay.mjs
          node fc-agent-ledger/login-ux-fix.mjs
          cat fc-agent-ledger/password-policy-regression.mjs >> fc-agent-ledger/staging/FC-Agent-Ledger-Cloudflare-Free/tests/integration.test.mjs
          cd fc-agent-ledger/staging/FC-Agent-Ledger-Cloudflare-Free
          node --check src/worker.mjs
          node --check public/app.js
          node --test tests/*.test.mjs
          node <<'NODE'
          const fs=require('node:fs'),w=fs.readFileSync('src/worker.mjs','utf8'),app=fs.readFileSync('public/app.js','utf8');
          if(!w.includes('const ITERATIONS=100000;')||w.includes('const ITERATIONS=150000;'))throw Error('Cloudflare WebCrypto PBKDF2 100k fix missing');
          for(const s of ['name="remember" checked','name="savePassword"','data-action="toggle-password"','navigator.credentials?.store','autocomplete="new-password"'])if(!app.includes(s))throw Error('Login UX missing: '+s);
          console.log('LOGIN_FIX_SOURCE_CHECKS_PASS');
          NODE
          npm install --no-audit --no-fund
      - name: Keep existing dedicated D1 and setup token HASH (no migrations or user changes)
        working-directory: fc-agent-ledger/staging/FC-Agent-Ledger-Cloudflare-Free
        run: node ../../password-policy-deploy-config.cjs
      - name: Deploy corrected FC Agent Ledger Worker only
        working-directory: fc-agent-ledger/staging/FC-Agent-Ledger-Cloudflare-Free
        run: npx wrangler deploy
      - name: Verify live runtime, session forms and access control
        run: |
          node <<'NODE'
          const base='https://fc-agent-ledger-private-v1.futurecode-dubai-86851bf2.workers.dev';
          async function get(path){const r=await fetch(base+path,{cache:'no-store'});return {status:r.status,body:await r.text()}}
          const health=await get('/health');if(health.status!==200||!JSON.parse(health.body).ok)throw Error('D1 health failed');
          const u=await get('/app.js');
          if(u.status!==200||!u.body.includes('name="savePassword"')||!u.body.includes('data-action="toggle-password"')||!u.body.includes('name="remember" checked'))throw Error('Live login UI not updated');
          const boot=await get('/api/bootstrap/status');if(boot.status!==200)throw Error('Bootstrap status unavailable');
          const anonymous=await get('/api/tenants');if(anonymous.status!==401)throw Error('Tenant authorization missing');
          const bad=await fetch(base+'/api/bootstrap',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({setupToken:'invalid-on-purpose',email:'nobody@example.invalid',displayName:'Test',password:'1'})});
          if(bad.status!==403&&bad.status!==409)throw Error('Bootstrap denies invalid token incorrectly: '+bad.status);
          console.log('FC_AGENT_LEDGER_LIVE_SETUP_PASSWORD_UI_HEALTH_CHECK_PASS');
          NODE
