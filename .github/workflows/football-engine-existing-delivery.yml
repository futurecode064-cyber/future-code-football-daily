name: Football Existing Git-Based Pages Delivery Check
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  git-delivery-preflight:
    if: >-
      github.repository == 'futurecode064-cyber/future-code-football-daily' &&
      github.event.pull_request.number == 36 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'football-engine/workers-d1-migration' &&
      github.event.label.name == 'football-engine-existing-delivery-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify canonical/main tree and existing production GitHub mirror tree
        run: node scripts/football/check-existing-pages-delivery.mjs football-existing-delivery-report.json
      - name: Save non-secret read-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-existing-github-delivery-preflight
          path: football-existing-delivery-report.json
          retention-days: 14
          if-no-files-found: warn
# This action makes only read-only git fetch calls; no deployment, build, API token or content update.
