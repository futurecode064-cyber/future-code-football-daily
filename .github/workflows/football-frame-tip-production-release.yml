name: Publish Complete Seven-Section Multi-Select Football Frame Editor
on:
  push:
    branches: [main]
    paths: ['.github/workflows/football-frame-tip-production-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-frame-tip-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: futurecode064-cyber/AI-Recap-GitHub
          ref: football-daily-render
          path: publish-source
          fetch-depth: 1
      - name: Final owner-approved frame release snapshot and source preflight
        run: |
          set -euo pipefail
          test "$(git -C publish-source rev-parse HEAD)" = "6cb656a69b4fd1253561d7f7774f0babed695b47"
          test -f publish-source/football-daily/_worker.js
          test -f publish-source/football-daily/_routes.json
          test -f publish-source/football-daily/main-tip-scores.js
          grep -q 'main-tip-scores.js' publish-source/football-daily/index.html
          grep -q 'sectionLayoutSettings' publish-source/football-daily/frame-editor.html
          grep -q 'frame-workspace.js?v=20261028-multi-select-v1' publish-source/football-daily/frame-editor.html
          grep -q 'frame-export-engine.js?v=20261028-multi-select-v1' publish-source/football-daily/frame-editor.html
          grep -q 'EFL Cup' publish-source/football-daily/main-export-logos.js
          grep -q 'value="oddsCards"' publish-source/football-daily/frame-editor.html
          grep -q 'id="frameDownloadName"' publish-source/football-daily/frame-editor.html
          grep -q 'id="multiSelectionCenter"' publish-source/football-daily/frame-editor.html
          grep -q 'frame-multi-download.js?v=20261028-multi-select-v1' publish-source/football-daily/frame-editor.html
          test -s publish-source/football-daily/frame-multi-download.js
          node --check publish-source/football-daily/frame-multi-download.js
          node --test publish-source/football-daily/tests/frame-multi-selection.test.cjs
          grep -q 'PNG-Images/' publish-source/football-daily/frame-export-engine.js
          grep -q 'oddsCards' publish-source/football-daily/main-professional-frame-studio.js
          grep -q 'oddsCards' publish-source/football-daily/frame-workspace.js
          grep -q 'oddsCards' publish-source/football-daily/frame-export-engine.js
          grep -q '20261028-odds-cards-v5' publish-source/football-daily/index.html
          grep -q '20261028-branded-cards-v3' publish-source/football-daily/odds.html
          node --check publish-source/football-daily/burmese-red-odds-frame.js
          node --check publish-source/football-daily/main-professional-frame-studio.js
          node --check publish-source/football-daily/main-tip-scores.js
          node --check publish-source/football-daily/frame-workspace.js
          node --check publish-source/football-daily/frame-export-engine.js
          node --check publish-source/football-daily/main-ai-bulk-export.js
          node --check publish-source/football-daily/main-ai-score.js
          node --check publish-source/football-daily/main-export-logos.js
          # Old test has obsolete 20261028-pair-layout version assertion; check release contract instead.
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const root='publish-source/football-daily/';
          const src=n=>readFileSync(root+n,'utf8');
          const html=src('frame-editor.html'),workspace=src('frame-workspace.js'),exporter=src('frame-export-engine.js');
          assert.equal((html.match(/value="oddsCards"/g)||[]).length,2);
          for(const marker of ['migrateOddsCardsAssignment','frameDownloadName'])assert.ok(workspace.includes(marker),marker);
          for(const marker of ['PNG-Images/','f.downloadName||f.name','p.wrap(native,"oddsCards","pro:"+f.id)'])assert.ok(exporter.includes(marker),marker);
          assert.ok(src('burmese-red-odds-frame.js').includes('shade(red,.36)'));
          assert.ok(src('main-professional-frame-studio.js').includes('w,top,0,"stretch"'));
          console.log('Final branded cards, complete banner, filename and single-folder ZIP source checks PASS');
          NODE
          node -e 'if(require("./publish-source/football-daily/data/tips/2026-10-28.json").items.length!==18)process.exit(1)'
      - name: Verify correct Cloudflare project before writing
        env:
          FOOTBALL_PAGES_CF_API_TOKEN: ${{ secrets.FOOTBALL_PAGES_CF_API_TOKEN }}
          CF_ACCOUNT_ID: '86851bf21d81d8f0972052aff8162149'
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.FOOTBALL_PAGES_CF_API_TOKEN;
          if(!token||token.length<24)throw Error('Cloudflare token missing; no changes made');
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT_ID+'/pages/projects/future-code-football-daily';
          const r=await fetch(url,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(25000)});
          const a=await r.json();
          if(!r.ok||!a.success)throw Error('Pages project inaccessible');
          const p=a.result;
          if(p.name!=='future-code-football-daily'||p.production_branch!=='football-daily-render'||p.source?.config?.owner!=='futurecode064-cyber'||p.source?.config?.repo_name!=='AI-Recap-GitHub'||p.build_config?.destination_dir!=='football-daily')
           throw Error('Unexpected Pages source or project; refuse deployment');
          console.log('Project verified. Current deployment:',p.canonical_deployment?.id);
          NODE
      - name: Install existing Wrangler
        run: npm ci --prefix services/football-engine --ignore-scripts
      - name: Deploy approved production snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FOOTBALL_PAGES_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '86851bf21d81d8f0972052aff8162149'
        run: |
          # Checkout the actual production branch and omit --branch so Wrangler
          # uses the project's production environment (not a preview alias).
          cd publish-source
          git branch --show-current
          test "$(git branch --show-current)" = "football-daily-render"
          ../services/football-engine/node_modules/.bin/wrangler pages deploy football-daily --project-name future-code-football-daily --commit-hash 6cb656a69b4fd1253561d7f7774f0babed695b47 --commit-message "Owner-approved complete seven-section Multi-Selection Frame Editor" --commit-dirty=true

      - name: Verify live PRODUCTION frame editor, all seven sections, independent filter modules and unified ZIP
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            curl -fsSL --max-time 18 "https://future-code-football-daily.pages.dev/frame-editor?release=6cb656a69-$i" -o /tmp/fc-frame.html || true
            curl -fsSL --max-time 18 "https://future-code-football-daily.pages.dev/frame-multi-download.js?release=6cb656a69-$i" -o /tmp/fc-multi.js || true
            curl -fsSL --max-time 18 "https://future-code-football-daily.pages.dev/frame-export-engine.js?release=6cb656a69-$i" -o /tmp/fc-export.js || true
            curl -fsSL --max-time 18 "https://future-code-football-daily.pages.dev/frame-workspace.js?release=6cb656a69-$i" -o /tmp/fc-workspace.js || true
            if grep -q '20261028-multi-select-v1' /tmp/fc-frame.html && grep -q 'id="multiSelectionCenter"' /tmp/fc-frame.html && grep -q 'value="oddsCards"' /tmp/fc-frame.html && grep -q 'getPreferences' /tmp/fc-multi.js && grep -q 'FCStudioMulti?.plans?.()' /tmp/fc-export.js && grep -q 'PNG-Images/' /tmp/fc-export.js && grep -q 'getRows:rawData' /tmp/fc-workspace.js; then
              echo 'PRODUCTION SEVEN-SECTION FRAME MULTI-SELECT VERIFIED'
              exit 0
            fi
            sleep 8
          done
          echo "::error::Production hostname does not show the final frame editor."
          exit 1
