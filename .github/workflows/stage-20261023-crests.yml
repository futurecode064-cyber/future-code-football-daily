name: Stage Oct 23 genuine team crests (no Cloudflare deploy)
on:
  push:
    branches:
      - daily-2026-10-23-final-prep
    paths:
      - '.github/workflows/stage-20261023-crests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: daily-2026-10-23-final-prep
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Download actual team crests and produce same-origin PNG mapping
        run: python football-daily/scripts/cache_20261023_logos.py
      - name: Commit verified PNG assets on staging branch only
        run: |
          git config user.name 'future-code-staging-assets[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-daily/assets/brand-export-teams football-daily/assets/league-logos football-daily/main-export-logos.js football-daily/brand-export-data.js
          git diff --cached --quiet || (git commit -m 'Bundle verified Oct 23 official team crests and league label assets' && git push origin HEAD:daily-2026-10-23-final-prep)
