name: Journal compatible update builds
on:
  push:
    branches: [fix/journal-update-install-20261114]
    paths: ['.github/workflows/journal-compatible-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        brand: [goal, ykz, bw, kothet, kmm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build original branded source
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          python3 -m pip install --user pillow
          python3 android-football/prepare.py '${{ matrix.brand }}' --config android-football/google-services.json > /tmp/meta.json
          python3 - <<'PY'
          import json,subprocess,pathlib,shutil,os
          m=json.load(open('/tmp/meta.json'))
          subprocess.run(['gradle','-p','android-football','-PfcPackage='+m['package'],'-PfcVersionCode='+str(m['versionCode']),'-PfcVersionName='+m['versionName'],':app:assembleRelease'],check=True)
          out=pathlib.Path('output');out.mkdir()
          shutil.copy('android-football/app/build/outputs/apk/release/app-release-unsigned.apk',out/'unsigned.apk')
          shutil.copy('/tmp/meta.json',out/'meta.json')
          shutil.copy(os.environ['ANDROID_HOME']+'/build-tools/35.0.0/lib/apksigner.jar',out/'apksigner.jar')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: journal-${{ matrix.brand }}-compatible
          path: output/
