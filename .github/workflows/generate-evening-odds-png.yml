name: Generate approved evening odds PNG files
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: Approved YYYY-MM-DD report date
        required: true
        default: '2026-10-14'
  push:
    branches:
      - fix/evening-static-png-direct-download-20261014
    paths:
      - .github/workflows/generate-evening-odds-png.yml
permissions:
  contents: write
concurrency:
  group: evening-png-static-assets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG renderer and Myanmar font
        run: |
          python -m pip install --disable-pip-version-check Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          test -f /usr/share/fonts/truetype/noto/NotoSansMyanmar-Regular.ttf
          test -f /usr/share/fonts/truetype/noto/NotoSansMyanmar-Bold.ttf
      - name: Render verified report
        env:
          DATE: ${{ github.event.inputs.report_date || '2026-10-14' }}
        run: |
          python football-daily/scripts/generate_evening_png.py "$DATE"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          paths=list(Path('football-daily/data/odds/evening/png/').glob('*/*.png'))
          assert len(paths)>=12, f"Expected 12 PNGs but found {len(paths)}"
          for path in paths:
              with Image.open(path) as image:
                  image.verify()
              assert path.stat().st_size>10000, f"Empty PNG: {path}"
          print('Verified static PNG exports:',len(paths))
          PY
      - name: Save generated PNG images to this branch
        run: |
          set -euo pipefail
          git config user.name "future-code-evening-png[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- football-daily/data/odds/evening/png/
          if git diff --cached --quiet; then
            echo "All PNG files already up to date."
          else
            git commit -m "Add downloadable static evening odds PNG images for all four brands"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
