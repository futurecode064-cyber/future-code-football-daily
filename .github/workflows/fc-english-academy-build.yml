name: Future Code English Academy — Android QA Build
on:
  push:
    branches: [feature/english-academy-v1-20261027]
    paths:
      - '.android-builds/English_Academy_Build_Package.zip'
      - '.github/workflows/fc-english-academy-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract dedicated app source (without affecting football source)
        run: |
          mkdir -p english-build
          unzip -q .android-builds/English_Academy_Build_Package.zip -d english-build
          test -s english-build/android/assets/lessons.js
          test -s english-build/android/res/drawable/icon.png
      - name: Validate teaching content and JS
        run: |
          python3 english-build/tests/check_course.py
          node --check english-build/android/assets/app.js
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('english-build/android/assets/lessons.json')
          d=json.loads(p.read_text())
          assert len(d['lessons']) == 48
          assert list(d['levels']) == ['A0','A1','A2','B1','B2','C1']
          print('Verified 48 bilingual lessons and six levels.')
          PY
      - name: Compile unsigned Android APK
        run: python3 english-build/android/build.py
      - name: Make testing-only signed APK (NOT a production release)
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/qa.jks" -storepass android -keypass android -alias qa -keyalg RSA -keysize 2048 -validity 3 -dname 'CN=English Academy QA Only'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/qa.jks" --ks-pass pass:android --out english-build/English-Academy-TEST-ONLY.apk english-build/android/build/Future_Code_English_Academy_v1.0.0_unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose english-build/English-Academy-TEST-ONLY.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging english-build/English-Academy-TEST-ONLY.apk | grep mm.futurecode.englishacademy
          unzip -t english-build/English-Academy-TEST-ONLY.apk | tail -1
          cat > english-build/IMPORTANT_QA.txt <<'NOTE'
          This test APK is signed with an EPHEMERAL QA KEY.
          Do not publish this APK as the permanent release.
          For final publication, sign the unsigned APK with an owner-controlled persistent key and keep that keystore securely.
          Version updates require the SAME persistent signing key.
          The Android update prompt may require user confirmation.
          Website hosting and download analytics are not activated by this isolated QA build.
          NOTE
      - name: Upload QA installable APK + unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: Future-Code-English-Academy-QA-Build
          path: |
            english-build/English-Academy-TEST-ONLY.apk
            english-build/android/build/Future_Code_English_Academy_v1.0.0_unsigned.apk
            english-build/IMPORTANT_QA.txt
          if-no-files-found: error
