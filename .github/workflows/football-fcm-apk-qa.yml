name: Football FCM Android six-brand QA
on:
  push:
    branches: [verify-football-apk-release]
    paths: ['android-football/**', 'android-journal/**', '.github/workflows/football-fcm-apk-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {brand: goal, package: mm.futurecode.sportsjournal, code: 5}
          - {brand: ykz, package: com.futurecode.ykzsoccertips, code: 5}
          - {brand: bw, package: com.futurecode.bwsportjournal, code: 4}
          - {brand: kothet, package: com.futurecode.kothetfamilyjournal, code: 5}
          - {brand: kmm, package: com.futurecode.kmmsporthub, code: 4}
          - {brand: bcf, package: mm.futurecode.betcityfamily, code: 4}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Install SDK and image conversion
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          python3 -m pip install --user pillow androguard
      - name: Prepare and compile Android client
        run: |
          set -euo pipefail
          META=$(python3 android-football/prepare.py '${{ matrix.brand }}' --config android-football/google-services.json)
          VERSION=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["versionName"])' "$META")
          gradle -p android-football -PfcPackage='${{ matrix.package }}' -PfcVersionCode='${{ matrix.code }}' -PfcVersionName="$VERSION" :app:assembleDebug
          APK=android-football/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/football/verify-apk-release.py "$APK" '${{ matrix.package }}' '${{ matrix.code }}'
          mv "$APK" "${{ matrix.brand }}-fcm-qa.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: football-${{ matrix.brand }}-fcm-qa
          path: ${{ matrix.brand }}-fcm-qa.apk
          if-no-files-found: error
