name: Football Pages Write Permission No-op Probe
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  probe:
    if: >-
      github.repository == 'futurecode064-cyber/future-code-football-daily' &&
      github.event.pull_request.number == 36 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'football-engine/workers-d1-migration' &&
      github.event.label.name == 'football-engine-pages-write-probe'
    runs-on: ubuntu-latest
    concurrency:
      group: football-pages-write-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Confirm Pages Write permission with a no-op project PATCH
        env:
          FOOTBALL_PAGES_CF_API_TOKEN: ${{ secrets.FOOTBALL_PAGES_CF_API_TOKEN }}
        run: node scripts/football/probe-pages-write.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-pages-write-no-op-result
          path: football-pages-write-probe.json
          retention-days: 14
          if-no-files-found: warn
