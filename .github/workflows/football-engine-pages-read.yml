name: Football Pages Read-Only Release Preflight
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  read-pages:
    if: >-
      github.repository == 'futurecode064-cyber/future-code-football-daily' &&
      github.event.pull_request.number == 36 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'football-engine/workers-d1-migration' &&
      github.event.label.name == 'football-engine-pages-read-check'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read project metadata; do not read secret values, edit or deploy
        env:
          FOOTBALL_STAGING_CF_API_TOKEN: ${{ secrets.FOOTBALL_STAGING_CF_API_TOKEN }}
          FOOTBALL_PAGES_CF_API_TOKEN: ${{ secrets.FOOTBALL_PAGES_CF_API_TOKEN }}
        run: node scripts/football/check-pages-read-only.mjs football-pages-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-pages-readonly-preflight
          path: football-pages-preflight.json
          retention-days: 14
          if-no-files-found: warn
# No write Cloudflare operations; no production build triggered.
