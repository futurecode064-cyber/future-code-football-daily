name: VPN-Free Network Compatibility Preflight (Read-Only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/football/vpn-free-network-preflight.mjs
      - docs/football/VPN_FREE_ACCESS_PILOT_2026-11-15.md
      - .github/workflows/vpn-free-network-preflight.yml

permissions:
  contents: read

jobs:
  external-protocol-check:
    name: Probe existing sites over HTTP/1.1 and HTTP/2
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check scripts/football/vpn-free-network-preflight.mjs
      - name: Probe public URLs (no DNS/Cloudflare modifications)
        run: node scripts/football/vpn-free-network-preflight.mjs
      - name: Save read-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-free-preflight-results
          path: vpn-free-preflight-results.json
          if-no-files-found: warn
