name: Football Engine Isolated Browser Fallback QA
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  browser-qa:
    if: >-
      github.repository == 'futurecode064-cyber/future-code-football-daily' &&
      github.event.pull_request.number == 36 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'football-engine/workers-d1-migration' &&
      github.event.label.name == 'football-engine-browser-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Make temporary enabled staging site; leave production unchanged
        env:
          FOOTBALL_STAGING_API_ORIGIN: 'https://future-code-football-engine-staging.futurecode-dubai-86851bf2.workers.dev'
        run: |
          mkdir -p /tmp/football-frontend-preview
          node scripts/football/prepare-staging.mjs football-daily /tmp/football-frontend-preview/site "$FOOTBALL_STAGING_API_ORIGIN"
          python3 -m http.server 8788 --bind 127.0.0.1 -d /tmp/football-frontend-preview/site >/tmp/football-frontend-preview/server.log 2>&1 &
      - name: Test ten entry pages at desktop and mobile sizes, including safe static fallback
        env:
          FOOTBALL_QA_OUTPUT: 'football-staging-browser-evidence'
        run: node scripts/football/browser-staging-qa.mjs
      - name: Save screenshots and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-staging-browser-qa
          path: football-staging-browser-evidence/
          retention-days: 7
          if-no-files-found: warn
# No deployment and no production updates. Staging Worker only queried publicly (read-only).
