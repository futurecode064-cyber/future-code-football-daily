name: Football FCM / Signing Secret Readiness (safe metadata only)
on:
  push:
    branches: ['feature/football-bundled-fcm-20261029']
    paths: ['.github/workflows/football-fcm-secret-preflight.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/football-fcm-secret-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    env:
      FC_FIREBASE_APP_ID: ${{ secrets.FC_FIREBASE_APP_ID }}
      FC_FIREBASE_API_KEY: ${{ secrets.FC_FIREBASE_API_KEY }}
      FC_FIREBASE_PROJECT_ID: ${{ secrets.FC_FIREBASE_PROJECT_ID }}
      FC_FIREBASE_SENDER_ID: ${{ secrets.FC_FIREBASE_SENDER_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      BCF_RELEASE_KEYSTORE_B64: ${{ secrets.BCF_RELEASE_KEYSTORE_B64 }}
      BCF_RELEASE_STOREPASS: ${{ secrets.BCF_RELEASE_STOREPASS }}
      BCF_RELEASE_ALIAS: ${{ secrets.BCF_RELEASE_ALIAS }}
      BCF_RELEASE_KEYPASS: ${{ secrets.BCF_RELEASE_KEYPASS }}
    steps:
      - name: Check whether GitHub build-time credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          set +x
          for key in FC_FIREBASE_APP_ID FC_FIREBASE_API_KEY FC_FIREBASE_PROJECT_ID FC_FIREBASE_SENDER_ID FIREBASE_SERVICE_ACCOUNT_JSON BCF_RELEASE_KEYSTORE_B64 BCF_RELEASE_STOREPASS BCF_RELEASE_ALIAS BCF_RELEASE_KEYPASS; do
            if [[ -n "${!key:-}" ]]; then
              echo "$key=present"
              echo "$key=present" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$key=missing"
              echo "$key=missing" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          # GitHub Secrets and Cloudflare Worker Secrets are separate stores.
          echo "Cloudflare Worker secrets cannot be inferred from this result." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify provided BCF keystore public signer fingerprint (no private data output)
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${BCF_RELEASE_KEYSTORE_B64:-}" || -z "${BCF_RELEASE_STOREPASS:-}" ]]; then
            echo "BCF signing key unavailable in GitHub Actions Secrets"
            exit 0
          fi
          printf '%s' "$BCF_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bcf-key.p12"
          chmod 600 "$RUNNER_TEMP/bcf-key.p12"
          trap 'rm -f "$RUNNER_TEMP/bcf-key.p12"' EXIT
          KEYTOOL_ALIAS="${BCF_RELEASE_ALIAS:-bcf-release}"
          export KEYTOOL_STOREPASS="$BCF_RELEASE_STOREPASS"
          # Do not log alias, password, key material, or the full keystore listing.
          if ! keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/bcf-key.p12" \
              -storepass:env KEYTOOL_STOREPASS -alias "$KEYTOOL_ALIAS" > "$RUNNER_TEMP/cert-metadata.txt" 2>/dev/null; then
            echo "BCF keystore exists but alias/password/key type did not validate"
            exit 0
          fi
          grep -m1 'SHA256:' "$RUNNER_TEMP/cert-metadata.txt" || true
          echo "Compare this certificate to the exact already-distributed BCF APK, not only filename" >> "$GITHUB_STEP_SUMMARY"

      - name: Compare currently published APK signers (public metadata only)
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          mkdir -p "$RUNNER_TEMP/football-signers"
          cd "$RUNNER_TEMP/football-signers"
          cat > urls.tsv <<'URLS'
          GoalZone	https://raw.githubusercontent.com/futurecode064-cyber/future-code-football-daily/main/football-daily/future-code-journal/android/GoalZone_Sports_Journal_v1.0.1.apk
          YKZ	https://github.com/futurecode064-cyber/AI-Recap-GitHub/releases/download/ykz-soccer-tips-v1.1.0/YKZ-Soccer-Tips.apk
          BW	https://github.com/futurecode064-cyber/AI-Recap-GitHub/releases/download/bw-sport-journal-v1.0.0/BW-Sport-Journal.apk
          KoThet	https://github.com/futurecode064-cyber/AI-Recap-GitHub/releases/download/ko-thet-family-journal-v1.0.1/Ko-Thet-Family-Journal.apk
          KMM	https://github.com/futurecode064-cyber/AI-Recap-GitHub/releases/download/kmm-sport-hub-v1.0.0/KMM-Sport-Hub.apk
          BCF-Live	https://github.com/futurecode064-cyber/future-code-football-daily/releases/download/bcf-journal-v1.0.0/BCF-Bet-City-Family-v1.0.0.apk
          URLS
          while IFS=$'\t' read -r brand url; do
            echo "AUDIT_START $brand"
            if ! curl --fail --location --silent --show-error --retry 2 --max-time 70 "$url" -o "$brand.apk"; then
              echo "AUDIT_FAILED_DOWNLOAD $brand"
              continue
            fi
            if ! "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$brand.apk" > "$brand.signer.txt" 2>&1; then
              echo "AUDIT_FAILED_SIGNATURE $brand"
              continue
            fi
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$brand.apk" | grep -m1 "^package:" || true
            grep -m1 "Signer #1 certificate SHA-256 digest" "$brand.signer.txt" || true
            echo "AUDIT_COMPLETE $brand"
          done < urls.tsv
