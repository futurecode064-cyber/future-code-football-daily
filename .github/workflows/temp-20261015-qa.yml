name: Validate 15 October football report
on:
  push:
    branches:
      - publish/football-2026-10-15-verified
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Daily previews, prices, results and all brands
        run: node --test football-daily/tests/*.test.cjs
      - name: Daily report audit
        run: python football-daily/scripts/daily_guard.py audit
