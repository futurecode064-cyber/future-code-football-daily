name: Football Staging Encrypted SQL Backup
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  encrypted-backup:
    if: >-
      github.repository == 'futurecode064-cyber/future-code-football-daily' &&
      github.event.pull_request.number == 36 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'football-engine/workers-d1-migration' &&
      github.event.label.name == 'football-engine-encrypted-backup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: services/football-engine
      - name: Verify encryption and tamper-resistant restore tests
        run: node --test services/football-engine/tests/staging-backup-crypto.test.mjs
      - name: Export and encrypt managed STAGING D1 (never upload plaintext)
        env:
          FOOTBALL_STAGING_CF_API_TOKEN: ${{ secrets.FOOTBALL_STAGING_CF_API_TOKEN }}
          FOOTBALL_BACKUP_RECOVERY_KEY: ${{ secrets.FOOTBALL_BACKUP_RECOVERY_KEY }}
        run: node scripts/football/backup-staging-encrypted.mjs football-staging-db.enc.json football-staging-backup-report.json
      - name: Upload encrypted SQL only + non-secret verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-staging-encrypted-sql
          path: |
            football-staging-db.enc.json
            football-staging-backup-report.json
          retention-days: 90
          if-no-files-found: warn
# Public repository: never upload an unencrypted SQL snapshot; artifact encryption happens BEFORE upload.
# If FOOTBALL_BACKUP_RECOVERY_KEY is missing, encryption uses domain-separated Cloudflare token
# as a TEMPORARY migration-only safeguard. Configure independent key before production.
