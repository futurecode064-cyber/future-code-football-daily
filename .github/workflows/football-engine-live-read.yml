name: Football Engine Live Staging Read Check
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  check:
    if: >-
      github.repository == 'futurecode064-cyber/future-code-football-daily' &&
      github.event.pull_request.number == 36 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'football-engine/workers-d1-migration' &&
      github.event.label.name == 'football-engine-live-read-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check LIVE staging Worker, D1, CORS and draft privacy without data mutation
        env:
          FOOTBALL_STAGING_CF_API_TOKEN: ${{ secrets.FOOTBALL_STAGING_CF_API_TOKEN }}
        run: node scripts/football/check-staging-live.mjs football-live-staging-report.json
      - name: Store non-secret read-only smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-live-staging-report
          path: football-live-staging-report.json
          retention-days: 14
          if-no-files-found: warn
# This workflow never builds, deploys, validates, publishes, imports or changes staging/production data.
