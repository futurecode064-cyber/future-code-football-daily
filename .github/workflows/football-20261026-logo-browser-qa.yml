name: Verify 26 Oct six-site PNG logo output in Chromium
on:
  push:
    branches: [main]
    paths: ['.github/workflows/football-20261026-logo-browser-qa.yml']
permissions:
  contents: read
jobs:
  screenshot-logos:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify all team and league crests render in real frame preview canvases across six sites
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import {readFileSync} from 'node:fs';
          const source=JSON.parse(readFileSync('football-daily/data/today.json','utf8'));
          if(source.reportDate!=='2026-10-26'||source.matches.length!==11)throw Error('Source daily fixture set changed');
          const sites=[['Main','/'],['YKZ','/ykz-family/'],['BW','/bw-sport/'],['Ko Thet','/ko-thet-family/'],['Goal Zone','/future-code-journal/'],['KMM','/kmm-sport-hub/']];
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const origin='https://future-code-football-daily.pages.dev';
          try {
           for(const [name,route] of sites){
            const ctx=await browser.newContext({viewport:{width:400,height:850},deviceScaleFactor:1,acceptDownloads:true});
            const page=await ctx.newPage();
            page.on('console',m=>{if(m.type()==='error')console.log(name+' console: '+m.text().slice(0,160))});
            await page.goto(origin+route,{waitUntil:'domcontentloaded',timeout:50000});
            await page.waitForFunction(()=>!!window.FutureCodeCanvasKit&&!!window.FutureCodeFramePreview&&!!(window.FutureCodeMainLogoAssets||window.FutureCodeBrandExportData),null,{timeout:35000});
            const summary=await page.evaluate(async matches=>{
             const mapper=window.FutureCodeMainLogoAssets||window.FutureCodeBrandExportData;
             const crestUrls=[...new Set(matches.flatMap(m=>[m.homeCrestUrl,m.awayCrestUrl]))];
             const leagues=[...new Set(matches.map(m=>m.league))];
             function openImage(src){
              return new Promise((resolve,reject)=>{
               const im=new Image();im.crossOrigin='anonymous';
               const id=setTimeout(()=>reject(Error('Image timeout: '+src)),11000);
               im.onload=()=>{clearTimeout(id);if(im.naturalWidth<30||im.naturalHeight<30)return reject(Error('Bad image: '+src));resolve({w:im.naturalWidth,h:im.naturalHeight});};
               im.onerror=()=>{clearTimeout(id);reject(Error('Image load error: '+src));};im.src=src;
              });
             }
             const checked=await Promise.all(crestUrls.map(async url=>{
              const local=mapper.imageUrl(url);
              if(!local.startsWith(location.origin+'/assets/brand-export-teams/'))throw Error('Not pinned same-origin: '+url+' => '+local);
              return openImage(local);
             }));
             await Promise.all(leagues.map(async league=>{
              const url=mapper.leagueCrest(league);
              if(!url||!url.startsWith(location.origin+'/assets/league-logos/'))throw Error('League not local: '+league+' '+url);
              return openImage(url);
             }));
             const example=matches[0];
             const original=await window.FutureCodeFramePreview.render(example);
             const noCrests=await window.FutureCodeFramePreview.render({...example,homeCrestUrl:null,awayCrestUrl:null});
             const noLeague=await window.FutureCodeFramePreview.render({...example,league:'no-logo-test'});
             function pixelDifference(a,b,rect) {
              const p=a.getContext('2d',{willReadFrequently:true}).getImageData(...rect).data;
              const q=b.getContext('2d',{willReadFrequently:true}).getImageData(...rect).data;
              let diff=0;for(let i=0;i<p.length;i+=4)if(Math.abs(p[i]-q[i])+Math.abs(p[i+1]-q[i+1])+Math.abs(p[i+2]-q[i+2])>65)diff++;
              return diff;
             }
             const h=pixelDifference(original,noCrests,[120,22,205,195]);
             const a=pixelDifference(original,noCrests,[875,22,200,195]);
             const l=pixelDifference(original,noLeague,[567,7,65,64]);
             if(h<150||a<150||l<80)throw Error('Export preview missing real logo pixels: home='+h+' away='+a+' league='+l);
             const blob=await new Promise(resolve=>original.toBlob(resolve,'image/png'));
             if(!blob||blob.size<12000)throw Error('Preview PNG encode failed');
             return {teamCrests:checked.length,leagueCrests:leagues.length,exportPixels:[h,a,l],previewPNGBytes:blob.size};
            },source.matches);
            console.log(name+' VERIFIED '+JSON.stringify(summary));
            await ctx.close();
           }
          }finally{await browser.close();}
          NODE
