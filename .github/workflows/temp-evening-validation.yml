name: Publish safety check for evening odds
on:
  push:
    branches:
      - feature/evening-odds-2026-10-14
permissions:
  contents: read
jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check football-daily/evening-odds.js && node --check football-daily/odds.js
      - run: node --test football-daily/tests/*.test.cjs
