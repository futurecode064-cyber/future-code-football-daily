name: Goal Zone ZIP Section Isolation and Real Download QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/goal-zone-zip-live-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium test tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify isolated tabs and valid PNGs in downloaded ZIPs
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import {readFileSync,statSync} from 'node:fs';
          const base='https://future-code-football-daily.pages.dev/future-code-journal/';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:1260,height:870},acceptDownloads:true});
          const page=await context.newPage();
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(e.message));
          function zipItems(buf){
            const files=[];let pos=0;
            while(pos+30<buf.length&&buf.readUInt32LE(pos)===0x04034b50){
              const size=buf.readUInt32LE(pos+18),nameLength=buf.readUInt16LE(pos+26);
              const extraLength=buf.readUInt16LE(pos+28);
              const start=pos+30+nameLength+extraLength,end=start+size;
              if(end>buf.length)throw Error('Truncated ZIP payload');
              const filename=buf.toString('utf8',pos+30,pos+30+nameLength);
              const fileData=buf.subarray(start,end);
              if(filename.endsWith('.png')){
                if(fileData.length<1000||fileData.toString('hex',0,8)!=='89504e470d0a1a0a')
                  throw Error('Invalid PNG file in ZIP: '+filename+' ('+fileData.length+' bytes)');
              }
              files.push({filename,size});pos=end;
            }
            if(!files.length)throw Error('No entries inside ZIP');
            return files;
          }
          async function getZip(type,mode,expected){
            await page.evaluate(type=>{
              for(const box of document.querySelectorAll('input[name="gzCenterCategory"]')){
                box.checked=box.value===type;
                box.dispatchEvent(new Event('change',{bubbles:true}));
              }
            },type);
            await page.selectOption('#gzMode_'+type,mode);
            const downloadEvent=page.waitForEvent('download',{timeout:180000});
            await page.locator('#gzBulkDownload').click();
            const downloaded=await downloadEvent;
            if(!downloaded.suggestedFilename().endsWith('.zip'))throw Error('Not a ZIP download');
            const path=await downloaded.path();
            const contents=readFileSync(path),rows=zipItems(contents);
            const pngs=rows.filter(row=>row.filename.endsWith('.png'));
            if(pngs.length!==expected)
              throw Error(type+' '+mode+': expected '+expected+' PNGs, got '+pngs.length+'; '+JSON.stringify(rows));
            const status=await page.locator('#gzBulkStatus').innerText();
            console.log('DOWNLOAD VERIFIED',JSON.stringify({type,mode,pngs:pngs.length,size:statSync(path).size,status,rows}));
            return {pngs,rows};
          }
          try {
            await page.goto(base+'?section=previews',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>document.documentElement.dataset.gzSection==='previews',null,{timeout:20000});
            const hidden=await page.locator('#gzDownloadCenter').evaluate(el=>getComputedStyle(el).display==='none');
            if(!hidden)throw Error('ZIP panel incorrectly visible in Preview section');
            await page.goto(base+'?section=downloads',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>document.documentElement.dataset.gzSection==='downloads',null,{timeout:20000});
            await page.waitForFunction(()=>document.querySelector('#gzBulkDownload')&&!document.querySelector('#gzBulkDownload').disabled,null,{timeout:60000});
            if(!await page.locator('#gzDownloadCenter').isVisible())throw Error('Dedicated ZIP panel hidden');
            if(await page.locator('#matchList').isVisible())throw Error('Previews mixed into Downloads tab');
            const modes=await page.locator('[id^="gzMode_"]').count();
            if(modes!==7)throw Error('Expected seven independent section layouts, got '+modes);
            await page.selectOption('#gzBulkLeague','all');
            await getZip('odds','single',1);
            await getZip('results','two',2);
            // Re-select ALL categories and check the full multi-section ZIP.
            await page.evaluate(()=>{
              for(const box of document.querySelectorAll('input[name="gzCenterCategory"]')){
                box.checked=true;
                box.dispatchEvent(new Event('change',{bubbles:true}));
              }
            });
            const counts=await page.evaluate(async()=>{
              const read=async p=>await (await fetch(new URL('../data/'+p,document.baseURI),{cache:'no-store'})).json();
              const report=await read('today.json');
              const day=report.reportDate;
              const previous=new Date(day+'T12:00:00Z');
              previous.setUTCDate(previous.getUTCDate()-1);
              const yday=previous.toISOString().slice(0,10);
              const [odds,results,news]=await Promise.all([read('odds/'+day+'.json'),read('archive/'+yday+'.json'),read('news/latest.json')]);
              const previews=report.matches.filter(m=>m.home&&m.away&&m.status!=='finished'&&!m.fixtureOnly);
              const specials=previews.filter(m=>m.specialChoice===true);
              const finished=results.matches.filter(m=>m.status==='finished'&&/^\d+\s*[-:]\s*\d+$/.test(String(m.finalScore||'')));
              return {preview:previews.length,special:specials.length,odds:odds.matches.length?1:0,results:Math.min(2,finished.length),ai:Math.min(2,previews.length),probability:previews.length?1:0,news:news.items.length};
            });
            const allDownload=page.waitForEvent('download',{timeout:480000});
            await page.locator('#gzBulkDownload').click();
            const fullZip=await allDownload;
            const fullBuf=readFileSync(await fullZip.path());
            const allRows=zipItems(fullBuf);
            const expected=Object.values(counts).reduce((a,b)=>a+b,0);
            const actual=allRows.filter(r=>r.filename.endsWith('.png')).length;
            const byType={};
            for(const row of allRows.filter(r=>r.filename.endsWith('.png'))){
              const category=row.filename.split('/')[0];
              byType[category]=(byType[category]||0)+1;
            }
            console.log('ALL-SECTIONS ZIP',JSON.stringify({expected,actual,counts,byType,size:fullBuf.length,status:await page.locator('#gzBulkStatus').innerText(),extra:allRows.filter(r=>!r.filename.endsWith('.png'))}));
            if(actual!==expected)throw Error('Incomplete Goal Zone all-section ZIP: '+actual+' PNGs versus '+expected);
            for(const [type,count] of Object.entries(counts)){
              if((byType[type]||0)!==count)throw Error('Incomplete category '+type+': '+byType[type]+' / '+count);
            }
            if(pageErrors.length)console.log('Browser JS notices: '+JSON.stringify(pageErrors));
            console.log('GOAL ZONE ZIP LIVE QA COMPLETE');
          }finally{await browser.close();}
          NODE
