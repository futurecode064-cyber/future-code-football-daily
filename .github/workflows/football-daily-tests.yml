name: Football Daily Website Tests
on:
  push:
    branches:
      - main
      - football-standalone-ready
    paths:
      - 'football-daily/**'
      - '.github/workflows/football-daily-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check football-daily/app.js
          node --check football-daily/odds.js
          node --check football-daily/daily-image-export.js
          node --check football-daily/card-export.js
          node --check football-daily/canvas-image-kit.js
      - name: Football navigation, date and active league tests
        run: node --test football-daily/tests/*.test.cjs
      - name: Football score and report Python syntax
        run: |
          python -m py_compile football-daily/scripts/daily_guard.py football-daily/scripts/sync_scores.py
          # Full daily report + Myanmar odds publication requires strict current-day checks.
          # Verified previous-night FT results are archived separately and must be allowed
          # while the user withholds today's match previews and Special Choices.
          # Archive-only updates are validated by node tests/verified-results.test.cjs.
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- football-daily/data/today.json football-daily/data/odds; then
            echo "Today's report and odds unchanged; skip current-day publication audit (UI/archive-only update)."
          else
            python football-daily/scripts/daily_guard.py audit
          fi
