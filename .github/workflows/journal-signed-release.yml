name: Journal signed update compatibility and release
on:
  push:
    branches: [fix/journal-update-install-20261114]
    paths: ['.github/workflows/journal-signed-release.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Restore signed binaries and verify byte hashes
        run: python3 release-upload/verify.py
      - name: Fetch previous stable signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download football-noti-gallery-20261104 --pattern '*.apk' --dir previous
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install old stable then update without uninstall and launch each brand
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 release-upload/device-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-compatibility-api-${{ matrix.api }}
          path: qa-output/
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 release-upload/verify.py
      - name: Publish verified signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create journal-compatible-update-20261115 output/*.apk output/SHA256SUMS.txt release-upload/inventory.json --title 'Journal compatible updates — 15 Nov 2026' --notes 'Goal Zone 1.0.6; YKZ 1.2.4; BW 1.0.5; Ko Thet 1.0.6; KMM 1.0.5. Same preserved owner certificate as November 4 stable releases. Fixed GitHub APK redirect downloads, installer URI grants, displayed version and obsolete boot polling. Upgrade over previous stable and launch verified on Android API 30 and 35 emulators. Physical handset, OEM installer and notification delivery remain unverified.' --target '${{ github.sha }}'
