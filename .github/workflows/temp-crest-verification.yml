name: One-time 20261015 team badge verification
# Validate 14 alias spellings against ESPN's dated fixture list.
on:
  push:
    branches: [improve/football-20261015-odds-form-special]
    paths: [.github/workflows/temp-crest-verification.yml]
permissions:
  contents: write
jobs:
  badges:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python football-daily/scripts/verify_20261015_logos.py
      - run: |
          git config user.name "future-code-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football-daily/data/research/2026-10-15-verified-logos.json
          git commit -m "Record confirmed ESPN team badges for the October 15 report" || exit 0
          git push origin HEAD:improve/football-20261015-odds-form-special
