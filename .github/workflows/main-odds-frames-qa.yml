name: Temporary Main Odds Frame QA
on:
  push:
    branches:
      - fix/main-odds-frames-download-20261018
    paths:
      - 'football-daily/main-table-odds-frames.js'
      - 'football-daily/tests/main-table-odds-frames.test.cjs'
      - '.github/workflows/main-odds-frames-qa.yml'
permissions:
  contents: read
jobs:
  frame-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and main-only frame regression tests
        run: |
          node --check football-daily/main-table-odds-frames.js
          node --check football-daily/tests/main-table-odds-frames.test.cjs
          node --test football-daily/tests/main-table-odds-frames.test.cjs
