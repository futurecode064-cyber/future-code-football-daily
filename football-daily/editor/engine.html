<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Code · Shared Data Engine</title><link rel="stylesheet" href="/editor/editor.css"><style>main{max-width:1100px;margin:auto;padding:24px}textarea{width:100%;min-height:240px;font-family:monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{margin:6px}input{max-width:100%}</style></head><body><header><h1>Shared Football Data Engine</h1><a href="/editor/">လက်ရှိ Editor</a></header><main><p>အတည်ပြုထားသော ဖိုင်ကို Draft သိမ်းပြီး စစ်ဆေးပါ။ Publish မလုပ်မီ Website ငါးခုနှင့် Download စစ်ဆေးချက်များ ပြည့်စုံရပါမည်။</p><p id="status" role="status">စနစ်စစ်နေသည်…</p><button id="refresh">Publication ပြန်စစ်ရန်</button><button id="history">Version History</button><button id="backup">ရွေးထားသော Version Backup Download</button><section><h2>Draft ဖိုင်</h2><input id="file" type="file" accept="application/json,.json"><label for="payload">ပြင်ဆင်ထားသော Import JSON</label><textarea id="payload" spellcheck="false"></textarea><button id="save">Draft သိမ်းရန်</button></section><section><h2>စစ်ဆေးချက်</h2><label>Draft Version <input id="version"></label><button id="draft">Draft ဖွင့်ရန်</button><label for="review">QA evidence JSON</label><textarea id="review" spellcheck="false"></textarea><label><input id="migration" type="checkbox">မူလဒေတာနှင့် တူညီကြောင်း စစ်ပြီးသော ပထမဆုံး Migration သာ</label><button id="validate">Validation စစ်ရန်</button></section><section><h2>ထုတ်ဝေမှု</h2><label>Expected Generation <input id="generation" type="number" min="0"></label><label><input id="confirm" type="checkbox">ဖိုင်၊ Website များနှင့် Download output များကို အတည်ပြုပြီး ထုတ်ဝေရန် ရွေးချယ်ပါသည်။</label><p><button id="publish">စစ်ဆေးပြီး Draft ထုတ်ဝေရန်</button><button id="rollback">ရွေးထားသော ယခင် Version သို့ ပြန်သွားရန်</button></p></section><pre id="result" aria-live="polite"></pre></main><script src="/editor/engine.js" defer></script></body></html>
